<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>우리 카드 가계부</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=SUIT:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <section class="lock-screen" id="lockScreen">
      <div class="lock-card">
        <p class="eyebrow">입장</p>
        <h1>지은 현철</h1>
        <p class="lock-copy">PIN 4자리를 입력해 주세요.</p>
        <form class="lock-form" id="pinForm">
          <div class="pin-dots" id="pinDots" aria-label="PIN 입력 상태">
            <span class="pin-dot"></span>
            <span class="pin-dot"></span>
            <span class="pin-dot"></span>
            <span class="pin-dot"></span>
          </div>
          <div class="pin-pad">
            <button class="pin-key" type="button" data-pin-key="1">1</button>
            <button class="pin-key" type="button" data-pin-key="2">2</button>
            <button class="pin-key" type="button" data-pin-key="3">3</button>
            <button class="pin-key" type="button" data-pin-key="4">4</button>
            <button class="pin-key" type="button" data-pin-key="5">5</button>
            <button class="pin-key" type="button" data-pin-key="6">6</button>
            <button class="pin-key" type="button" data-pin-key="7">7</button>
            <button class="pin-key" type="button" data-pin-key="8">8</button>
            <button class="pin-key" type="button" data-pin-key="9">9</button>
            <div class="pin-spacer" aria-hidden="true"></div>
            <button class="pin-key" type="button" data-pin-key="0">0</button>
            <button class="pin-action" type="button" id="pinClearButton" aria-label="삭제">⌫</button>
          </div>
        </form>
        <p class="lock-error" id="pinError" hidden>PIN이 맞지 않아요.</p>
      </div>
    </section>

    <div class="app-shell" id="appShell" hidden>
      <header class="topbar">
        <div>
          <p class="eyebrow" id="monthLabel">이번달</p>
          <h1>지은 현철</h1>
        </div>
        <button class="icon-button" id="openSettingsButton" aria-label="설정">
          <span>⚙</span>
        </button>
      </header>

      <main class="content">
        <section class="hero-card">
          <div class="hero-copy">
            <p class="label">이번달 총합</p>
            <strong id="monthlyTotal">₩0</strong>
            <p class="subcopy" id="heroSummary">총 50만원 중 50만원 남음</p>
            <p class="period-copy" id="periodCopy">2026.05.01 - 2026.05.31</p>
          </div>
          <div class="hero-badges">
            <span>지은 <b id="meTotal">₩0</b></span>
            <span>현철 <b id="partnerTotal">₩0</b></span>
          </div>
          <button class="hero-link" id="openMonthSheetButton" type="button">월별 내역</button>
        </section>

        <section class="composer-card">
          <div class="panel-head">
            <div>
              <p class="eyebrow">저장</p>
              <h2>지출 저장</h2>
            </div>
          </div>
          <div class="quick-actions">
            <button class="quick-card primary" id="openPasteButton">
              <span class="quick-icon">⌘</span>
              <div>
                <strong>문자 붙여넣기</strong>
                <p>카톡 내용 저장</p>
              </div>
            </button>
            <button class="quick-card" id="openImageButton">
              <span class="quick-icon">◫</span>
              <div>
                <strong>사진 입력</strong>
                <p>스크린샷 저장</p>
              </div>
            </button>
            <button class="quick-card" id="openManualButton">
              <span class="quick-icon">✎</span>
              <div>
                <strong>직접 입력</strong>
                <p>바로 기록</p>
              </div>
            </button>
          </div>
        </section>
      </main>

      <button class="floating-add" id="openAddButton" aria-label="새 내역 추가">＋</button>
    </div>

    <section class="sheet-backdrop" id="entrySheet" hidden>
      <div class="sheet">
        <div class="sheet-handle"></div>
        <div class="sheet-head">
          <div>
            <p class="eyebrow" id="sheetEyebrow">새 내역</p>
            <h3 id="sheetTitle">지출 저장</h3>
            <p class="sheet-copy" id="sheetCopy">입력 방식에 맞게 저장해요.</p>
          </div>
          <button class="icon-button small" data-close-sheet="entrySheet" aria-label="닫기">×</button>
        </div>

        <div class="sheet-body">
          <label class="field-block" id="rawTextField">
            <span id="rawTextLabel">카카오톡 메시지</span>
            <textarea
              id="rawMessage"
              rows="5"
              placeholder="예: 05/05 14:33 스타벅스 성수 6,100원 일시불"
            ></textarea>
            <button class="ghost-button inline-button" id="parseMessageButton" type="button">
              입력하기
            </button>
          </label>

          <label class="field-block" id="imageField">
            <span id="imageFieldLabel">영수증 사진</span>
            <input id="receiptImage" type="file" accept="image/*" />
            <button class="ghost-button inline-button" id="ocrButton" type="button">
              영수증 입력
            </button>
            <p class="helper-text" id="ocrStatus">영수증 내용이 자동으로 채워져요.</p>
          </label>

          <div class="grid-two">
            <label class="field-block">
              <span>사용자</span>
              <select id="personInput">
                <option value="지은">지은</option>
                <option value="현철">현철</option>
              </select>
            </label>
            <label class="field-block">
              <span>결제일</span>
              <input id="dateInput" type="date" />
            </label>
          </div>

          <div class="grid-two">
            <label class="field-block">
              <span>가맹점</span>
              <input id="merchantInput" type="text" placeholder="예: 스타벅스 성수" />
            </label>
            <label class="field-block">
              <span>금액</span>
              <input id="amountInput" type="number" inputmode="numeric" placeholder="6100" />
            </label>
          </div>

          <label class="field-block">
            <span>메모</span>
            <textarea id="noteInput" rows="3" placeholder="예: 회의 전 커피, 선물 구매"></textarea>
          </label>

          <div class="sheet-actions">
            <button class="secondary-button" id="resetFormButton" type="button">초기화</button>
            <button class="primary-button" id="saveEntryButton" type="button">저장하기</button>
          </div>
        </div>
      </div>
    </section>

    <section class="sheet-backdrop" id="settingsSheet" hidden>
      <div class="sheet">
        <div class="sheet-handle"></div>
        <div class="sheet-head">
          <div>
            <p class="eyebrow">무료 동기화</p>
            <h3>GitHub 연결</h3>
          </div>
          <button class="icon-button small" data-close-sheet="settingsSheet" aria-label="닫기">×</button>
        </div>

        <div class="sheet-body">
          <div class="info-card">
            <strong>추천 구조</strong>
            <p>웹앱은 public GitHub Pages, 실제 사용내역은 private 저장소에 JSON으로 보관하면 돼요.</p>
          </div>

          <label class="field-block">
            <span>GitHub Owner</span>
            <input id="githubOwner" type="text" placeholder="예: your-id" />
          </label>
          <label class="field-block">
            <span>Private Repo 이름</span>
            <input id="githubRepo" type="text" placeholder="예: couple-expenses-data" />
          </label>
          <label class="field-block">
            <span>저장 파일 경로</span>
            <input id="githubPath" type="text" placeholder="예: data/expenses.json" />
          </label>
          <label class="field-block">
            <span>Personal Access Token</span>
            <input id="githubToken" type="password" placeholder="contents 읽기/쓰기 권한 토큰" />
            <p class="helper-text">토큰은 이 브라우저 세션에만 잠깐 보관하고, 페이지를 닫으면 사라지게 만들었어요.</p>
          </label>
          <label class="field-block">
            <span>암호화 비밀번호</span>
            <input id="syncPassphrase" type="password" placeholder="두 분만 아는 비밀번호" />
            <p class="helper-text">GitHub에는 암호화된 데이터만 저장돼요. 이 비밀번호는 저장하지 않아요.</p>
          </label>

          <div class="sheet-actions">
            <button class="secondary-button" id="loadGithubButton" type="button">GitHub에서 불러오기</button>
            <button class="primary-button" id="saveGithubButton" type="button">GitHub로 저장하기</button>
          </div>
        </div>
      </div>
    </section>

    <section class="sheet-backdrop" id="monthSheet" hidden>
      <div class="sheet">
        <div class="sheet-handle"></div>
        <div class="sheet-head">
          <div>
            <p class="eyebrow">내역</p>
            <h3>월별 보기</h3>
            <p class="sheet-copy">월별 합계와 최근 내역</p>
          </div>
          <button class="icon-button small" data-close-sheet="monthSheet" aria-label="닫기">×</button>
        </div>
        <div class="sheet-body">
          <div class="month-list" id="monthList"></div>
        </div>
      </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="./script.js"></script>
  </body>
  </html>
